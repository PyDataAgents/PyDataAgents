[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pydag"
version = "v0.0.0a1"
description = "An IIoT framework for reading and writing from sources/sinks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["IIoT", "Industrial Datalogging", "software robots", "data agents"]
authors = [
  { name = "Jonas Hillenbrand", email = "hillenbrandjonas@hotmail.com" },
  { name = "2Obe", email = "twoobe.mail@gmail.com" }
]
classifiers = [
  "Development Status :: 2 - Experimental",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11"
]
dependencies = [
    "loguru",
    "opcua",
    "pyads",
    "fastapi[standard]",
    "PyYAML",
    "sounddevice",
    "numpy",
    "pandas",
    "paho-mqtt",
    "urllib3",
    "jsonpath-ng",
    "influxdb-client",
    "python-snap7",
    "APScheduler",
    "websocket-client",
    "selenium",
    "openpyxl",
    "pyodbc",
    "pypdf",
    "unstructured[all-docs]",
    "watchdog",
    "bs4",
    "pytest",
    "ics",
    "msal",
    "sktime",
    "numba",
    "torch",
    "seaborn",
    "tirex-ts @ git+https://github.com/NX-AI/tirex",
    "chronos-forecasting",
    "langchain",
    "langchain-community",
    "langchain-chroma",
    "langchain-huggingface",
    "langchain-unstructured",
    "langchain-openai",
    "langchain-ollama",
    "sentence-transformers",
    "langgraph",
    "langchain-tavily",
    "ross-rotordynamics",
    "cadquery",
    "cq-editor",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pydag*"]
exclude = ["tests"]

[tool.setuptools.package-data]
"pydag" = ["**/*.html"]

[project.urls]
Documentation = "https://github.com/PyDataAgents/PyDataAgents.git"
Issues = "https://github.com/PyDataAgents/PyDataAgents.git"
Source = "https://github.com/PyDataAgents/PyDataAgents.git"