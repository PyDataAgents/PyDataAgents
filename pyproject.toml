[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydatagrabber"
version = "0.0.1a3"
description = 'An IIoT framework for reading and writing from sources/sinks.'
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["IIoT", "Industrial Datalogging", "software robots", "data agents"]
authors = [
  { name = "Jonas Hillenbrand", email = "" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11"
]
dependencies = [
    "loguru",
    "opcua",
    "pyads",
    "fastapi[standard]",
    "PyYAML",
    "sounddevice",
    "numpy",
    "paho-mqtt",
    "urllib3",
    "jsonpath-ng",
    "influxdb-client",
    "python-snap7",
    "APScheduler"
]

[tool.setuptools.packages.find]
where = ["."]
packages = ["pydatagrabber", "pydatagrabber.grabbers"]
include = ["pydatagrabber*"]
exclude = ["tests"]

[project.urls]
Documentation = "https://github.com/jhillenbrand/PyDataGrabber"
Issues = "https://github.com/jhillenbrand/PyDataGrabber"
Source = "https://github.com/jhillenbrand/PyDataGrabber"