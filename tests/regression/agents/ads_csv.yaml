agent:
  type: pydag.agents.Agent
  id: AG1
adapters:
- type: pydag.adapters.ads.AdsAdapter
  id: A1
  ams_net_id: 191.1.1.1.1.1
- type: pydag.adapters.csv.CsvWriteAdapter
  id: A2
  folder: .\tests\agents
  file_post_fix: 125kN
  file_extension: csv
  with_timestamp: true
  max_samples: 1000000
  delimiter: ;
  decimal_precision: 3
buffers:
- type: pydag.buffers.ListBuffer
  id: B1
  capacity: 1
  data_type: NUMERIC
  initial_values: null
  unit: 1
  description: 1
mappings:
- type: pydag.mappings.Mapping
  id: M1
  buffer_ids:
  - B1
  adapter_id: A1
  addresses:
  - MAIN.AdsCsvGrabberTest
  thread_type: MILLI_SECOND
  mapping_type: READ
  n: 1
  observing_time: 10
  persistent: true
- type: pydag.mappings.Mapping
  id: M2
  buffer_ids:
  - B1
  adapter_id: A2
  addresses: null
  thread_type: MILLI_SECOND
  mapping_type: WRITE
  n: 1
  observing_time: 10
  persistent: false
services: []
