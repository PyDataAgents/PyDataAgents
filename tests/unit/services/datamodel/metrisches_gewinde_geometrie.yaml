id: metrisches_gewinde_geometrie
name: Geometrie eines metrischen Gewindes
label_de: Geometrie eines metrischen Gewindes
label_en: Metric thread geometry
description_de: |-
    Übertragung von MetricScrewGeometry. D und P in mm, theta im Bogenmaß;
    D > 0, P > 0, 0 < theta < pi und d > 0. Ohne Vorgabe wird theta = pi/3
    verwendet und P aus der vorhandenen Excel-Tabelle bestimmt. Explizite
    Eingaben für P oder theta haben beim Vorwärtsrechnen Vorrang. d bezeichnet
    den Durchmesser nach der ursprünglichen 5H/8-Abflachung, keinen tolerierten
    Außengewinde-Kerndurchmesser. Keine Toleranz- oder Festigkeitsberechnung.    
description_en: |-
    Conversion of MetricScrewGeometry. D and P in mm, theta in radians;
    D > 0, P > 0, 0 < theta < pi and d > 0. Unless supplied, theta = pi/3
    is used and P is obtained from the existing Excel table. Explicit P or theta
    inputs take precedence in forward calculations. d denotes the diameter
    obtained with the original 5H/8 truncation, not a toleranced external-thread
    root diameter. No tolerance or strength calculation.
categories:
    - Maschinenelemente
    - Schrauben
tags:
    - MetricScrewGeometry
    - metric thread
    - Gewindegeometrie
symbols:
    D:
        unit: mm
        label_de: Nenndurchmesser
        description_de: Gewindeaußendurchmesser und Suchwert der Steigungstabelle
        label_en: Nominal diameter
        description_en: Thread major diameter and lookup key for the pitch table
    P:
        unit: mm
        label_de: Gewindesteigung
        description_de: Axialer Abstand benachbarter Gewindegänge; explizite Eingabe oder Tabellenwert
        label_en: Thread pitch
        description_en: Axial distance between adjacent threads; explicit input or table value
    theta:
        unit: rad
        label_de: Gewindeprofilwinkel
        description_de: Voller Profilwinkel; Standardwert pi/3 entspricht 60 Grad
        label_en: Thread profile angle
        description_en: Full included profile angle; default pi/3 corresponds to 60 degrees
    H:
        unit: mm
        label_de: Höhe des Ausgangsdreiecks
        description_de: Höhe des ungekürzten dreieckigen Gewindeprofils
        label_en: Fundamental triangle height
        description_en: Height of the untruncated triangular thread profile
    d:
        unit: mm
        label_de: Durchmesser nach 5H/8-Abflachung
        description_de: Durchmesser D minus 5H/4 gemäß der ursprünglichen Klasse
        label_en: Diameter after 5H/8 truncation
        description_en: Diameter D minus 5H/4 as defined by the original class
    D_p:
        unit: mm
        label_de: Flankendurchmesser
        description_de: Durchmesser D minus 3H/4
        label_en: Pitch diameter
        description_en: Diameter D minus 3H/4
formulas:
    0:
        equation: H = P/(2*tan(theta/2))
        label_de: Höhe des Ausgangsdreiecks
        description_de: Trigonometrische Beziehung aus Steigung und halbem Profilwinkel
        label_en: Fundamental triangle height
        description_en: Trigonometric relation using pitch and half the profile angle
    1:
        equation: d = D - 5*H/4
        label_de: Abgeflachter Durchmesser
        description_de: Beidseitiger radialer Abzug von 5H/8
        label_en: Truncated diameter
        description_en: Radial subtraction of 5H/8 on both sides
    2:
        equation: D_p = D - 3*H/4
        label_de: Flankendurchmesser
        description_de: Beidseitiger radialer Abzug von 3H/8
        label_en: Pitch diameter
        description_en: Radial subtraction of 3H/8 on both sides
    3:
        equation: theta = pi/3
        label_de: Standardprofilwinkel
        description_de: Standardwert bei nicht vorgegebenem theta; für andere Winkel theta explizit eingeben
        label_en: Default profile angle
        description_en: Default when theta is not supplied; supply theta explicitly for other angles

lookups:
    P:
        label_de: Steigung aus Durchmessertabelle
        description_de: Diskrete Zuordnung aus TABLE_METRIC_SCREWS ohne Interpolation; unbekannte Durchmesser ergeben nan
        label_en: Pitch from diameter table
        description_en: Discrete mapping from TABLE_METRIC_SCREWS without interpolation; unknown diameters return nan
        source: xlsx
        endpoint: metrisches_gewinde_geometrie.xlsx
        query: "'Major Diameter D [mm]'=D"
sources:
    - ./metrisches_gewinde_geometrie.xlsx, TABLE_METRIC_SCREWS, Spalten Major Diameter D [mm] und Pitch P [mm]; widersprüchliche Zeile M27 ausgelassen
