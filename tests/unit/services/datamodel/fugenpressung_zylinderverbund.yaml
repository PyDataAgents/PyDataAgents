label_de: Fugenpressung im Zylindrischen Pressverbund
description_de: Fugenpressung im Zylindrischen Pressverbund
label_en: Interface pressure in a cylindrical interference fit
description_en: Interface pressure in a cylindrical interference fit
id: fugenpressung_zylinderverbund
name: Fugenpressung im Zylindrischen Pressverbund
categories:
