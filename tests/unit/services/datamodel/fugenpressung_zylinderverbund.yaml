symbols:
    p:
        label_de: Fugenpressung
        description_de: benötigte Fugenpressung bzw. wirkende Fugenpressung
        label_en: Interface pressure
        description_en: Required or actual interface pressure
        unit: MPa
    M_t:
        label_de: Torsionsdrehmoment
        description_de: zu übertragendes Torsionsdrehmoment bzw. übertragbares Torsionsdrehmoment
        label_en: Torsional torque
        description_en: Torque to be transmitted or transmissible torque
        unit: N*m
    F_ax:
        label_de: Axialkraft
        description_de: zu übertragende Axialkraft bzw. übertragbare Axialkraft
        label_en: Axial force
        description_en: Axial force to be transmitted or transmissible axial force
        unit: N
    F_ax_res:
        label_de: Gesamtaxialkraft
        description_de: zu übertragende Gesamtaxialkraft bzw. übertragbare Gesamtaxialkraft
        label_en: Total axial force
        description_en: Total axial force to be transmitted or transmissible total axial force
        unit: N
    S_r:
        label_de: Sicherheitsfaktor gegen Rutschen
        description_de: Sicherheitsfaktor gegen Rutschen
        label_en: Safety factor against slipping
        description_en: Safety factor against slipping
        unit: "-"
    D_F:
        label_de: Trennfugendurchmesser
        description_de: Nennmass der Trennfuge zwischen Aussen- und Innenteil
        label_en: Interface diameter
        description_en: Nominal diameter of the interface between the outer and inner parts
        unit: mm
    l_F:
        label_de: Fugenlänge
        description_de: Länge der Fuge
        label_en: Interface length
        description_en: Length of the interface
        unit: mm
    µ_ru:
        label_de: Reibbeiwert
        description_de: Reibbeiwert in Umfangsrichtung
        label_en: Coefficient of friction
        description_en: Circumferential coefficient of friction
        unit: "-"
    D_aI:
        label_de: Aussendurchmesser Innenteil
        description_de: Aussendurchmesser Innenteil
        label_en: Outer diameter of the inner part
        description_en: Outer diameter of the inner part
        unit: mm
    D_iI:
        label_de: Innendurchmesser Innenteil
        description_de: Innendurchmesser Innenteil
        label_en: Inner diameter of the inner part
        description_en: Inner diameter of the inner part
        unit: mm
    D_iA:
        label_de: Innendurchmesser Aussenteil
        description_de: Innendurchmesser Aussenteil
        label_en: Inner diameter of the outer part
        description_en: Inner diameter of the outer part
        unit: mm
    D_aA:
        label_de: Aussendurchmesser Aussenteil
        description_de: Aussendurchmesser Aussenteil
        label_en: Outer diameter of the outer part
        description_en: Outer diameter of the outer part
        unit: mm
    U_i:
        label_de: Ist-Übermass
        description_de: Ist-Übermass
        label_en: Actual interference
        description_en: Actual interference
        unit: mm
    U_w:
        label_de: wirksames Übermass
        description_de: wirksames Übermass
        label_en: Effective interference
        description_en: Effective interference
        unit: mm
    R_zA:
        label_de: Rauhtiefe Aussenteil
        description_de: gemittelte Rauhtiefe im Innendurchmesser des Aussenteils
        label_en: Roughness depth of the outer part
        description_en: Mean roughness depth at the bore of the outer part
        unit: µm
    R_zI:
        label_de: Rauhtiefe Innenteil
        description_de: gemittelte Rauhtiefe im Aussendurchmesser des Innenteils
        label_en: Roughness depth of the inner part
        description_en: Mean roughness depth at the outside diameter of the inner part
        unit: µm
    Q_A:
        label_de: Durchmesserverhältnis Aussenteil
        description_de: Durchmesserverhältnis Aussenteil
        label_en: Diameter ratio of the outer part
        description_en: Diameter ratio of the outer part
        unit: "-"
    Q_I:
        label_de: Durchmesserverhältnis Innenteil
        description_de: Durchmesserverhältnis Innenteil
        label_en: Diameter ratio of the inner part
        description_en: Diameter ratio of the inner part
        unit: "-"
    xi_w:
        label_de: bezogenes wirksames Übermass
        description_de: bezogenes wirksames Übermass
        label_en: Relative effective interference
        description_en: Relative effective interference
        unit: "-"

    K:
        label_de: Hilfsgröße K
        description_de: Hilfsgrösse zur Berechnung des Zusammenhangs zwischen Fugenpressung und Übermass
        label_en: Auxiliary quantity K
        description_en: Auxiliary quantity relating interface pressure to interference
        unit: "-"
    E_A:
        label_de: E-Modul Aussenteil
        description_de: E-Modul des Aussenteils
        label_en: Young's modulus of the outer part
        description_en: Young's modulus of the outer part
        unit: MPa
    E_I:
        label_de: E-Modul Innenteil
        description_de: E-Modul des Innenteils
        label_en: Young's modulus of the inner part
        description_en: Young's modulus of the inner part
        unit: MPa
    nu_A:
        label_de: Querkontraktionszahl Aussenteil
        description_de: Querkontraktionszahl / Poisson-Zahl des Aussenteils
        label_en: Poisson's ratio of the outer part
        description_en: Lateral contraction ratio / Poisson's ratio of the outer part
        unit: "-"
    nu_I:
        label_de: Querkontraktionszahl Innenteil
        description_de: Querkontraktionszahl / Poisson-Zahl des Innenteils
        label_en: Poisson's ratio of the inner part
        description_en: Lateral contraction ratio / Poisson's ratio of the inner part
        unit: "-"
    S_pA:
        label_de: Sicherheit gegen plastische Dehnung Aussenteil
        description_de: Sicherheit gegen plastische Dehnung Aussenteil
        label_en: Safety factor against plastic strain in the outer part
