grabber:
  type: pydatagrabber.grabbers.Grabber
  id: G1
adapters:
- type: pydatagrabber.adapters.opcua.OpcUaAdapter
  id: A1
  endpoint: opc.tcp://localhost:4840/freeopcua/server/
buffers:
- type: pydatagrabber.buffers.ListBuffer
  id: B1
  capacity: 1000
  data_type: NUMERIC
  initial_values: null
  unit: 1
  description: Test buffer
mappings:
- type: pydatagrabber.mappings.Mapping
  id: M1
  buffer_ids:
  - B1
  adapter_id: A1
  addresses: null
  thread_type: MILLI_SECOND
  mapping_type: null
  n: 1
  sampling_period: 100
  persistent: true
services:
  - type: pydatagrabber.services.DataElementService
    nodes:
      - type: pydatagrabber.services.statemachine.actions.dataelements.InputBufferAction
        id: INPUTBUFFER
        buffer_id: B1
        data_type: NUMERIC
        unit: 1
        description: Input buffer for data elements 
      - type: pyde.innovators.featureextraction.RocketExtractor
        id: E1
        feature: 10
        parents: [INPUTBUFFER]

      
        
