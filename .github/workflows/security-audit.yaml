name: Weekly Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # forces Node 24

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install .

      - name: Install security tools
        run: pip install pip-audit bandit

      - name: Run pip-audit (JSON)
        run: pip-audit -f json -o pip-audit.json

      - name: Run Bandit (JSON)
        run: bandit -r . -f json -o bandit.json

      - name: Upload JSON reports
        uses: actions/upload-artifact@v4.7.0
        with:
          name: security-reports
          path: |
            pip-audit.json
            bandit.json