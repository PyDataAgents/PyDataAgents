<div class="grid">
    <div class="grid-div">
        <textarea id="prompt" placeholder="ask your questions here ..."></textarea>
        <div>
            <button onclick="submitPrompt()">Submit</button>
        </div>
    </div>
    <div class="grid-div">
        <input type="text" id="document-link" placeholder="Document Link"/>
        <div>
            <button onclick="submitDocumentLink()">Submit</button>
            <span id="documentlink-text"></span>
        </div>
    </div>
</div>
<div id="chat">
    <div id="placeholder-chat">
        <div class="left-chat">
            <p class="chat-question">
                First Question?
            </p>
        </div>    
        <div class="right-chat">
            <p class="chat-answer">
                Answer to the first question.
            </p>
        </div>
    </div>
</div>
<script>

    //var chatUrl = "http://localhost:10001/grabber/api/v1/llm/rag/S2/chat?question="; // URL to the chat service
    //var documentUrl = "http://localhost:10001/grabber/api/v1/llm/rag/S2/document?link="; // URL to the document service

    var chatUrl = "http://localhost:10001/grabber/api/v1/llm/rag/${RAGServiceID}/chat?question="; // URL to the chat service
    var documentUrl = "http://localhost:10001/grabber/api/v1/llm/rag/${RAGServiceID}/document?link="; // URL to the document service

    function submitPrompt(){
        var prompt = document.getElementById("prompt").value;
        fetch(chatUrl + prompt)
            .then((response) => response.text())
            .then((text) => appendChat(prompt, text));
    }

    function appendChat(question, answer){
        console.debug(question + " --> " + answer);
        var chatDiv = document.getElementById("chat");
        var placeholderDiv = document.getElementById("placeholder-chat");
        if (placeholderDiv != undefined) {
            chatDiv.removeChild(placeholderDiv);
        }
        var questionDiv = document.createElement("div");
        questionDiv.className = "left-chat";
        var questionText = document.createElement("p");
        questionText.className = "chat-question";
        questionText.innerHTML = question;
        questionDiv.appendChild(questionText);
        chatDiv.appendChild(questionDiv);
        var answerDiv = document.createElement("div");
        answerDiv.className = "right-chat";
        var answerText = document.createElement("p");
        answerText.className = "chat-answer";
        answerText.innerHTML = answer;
        answerDiv.appendChild(answerText);
        chatDiv.appendChild(answerDiv);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        var prompt = document.getElementById("prompt");
        prompt.value = "";
    }

    function submitDocumentLink(){
        var documentLink = document.getElementById("document-link").value;
        console.debug(documentLink);
        documentLink = encodeURI(documentLink);
        console.debug(documentLink);
        var documentLinkText = document.getElementById("documentlink-text");
        documentLinkText.innerHTML = "";
        var requestOptions = {
            method: "PUT",
            headers: { "Content-Type": "text/plain" }
        };
        fetch(documentUrl + documentLink, requestOptions)
            .then((response) => response.text())
            .then((text) => createDocumentLinkText(text));
    }

    function createDocumentLinkText(text){
        var documentLinkText = document.getElementById("documentlink-text");
        if (String(text).toLowerCase() == "true"){
            documentLinkText.innerHTML = "a new document was added to RAGEngine.";
        } else {
            documentLinkText.innerHTML = "the document could not be added.";
        }
        documentLinkText.value = "";
    }

</script>

<style>

    #chat {
        width: 100%;
        color: #000000;
        overflow-y: scroll;
        max-height: 400px;
    }

    #prompt {
        width: 100%;
    }

    .grid {
        display: grid;
        grid-template-columns: 70% 30%;
        gap: 10px;
    }

    .grid-div {
        display: grid;
        grid-auto-flow: rows;
    }

    .left-chat {
        text-align: left;
    }

    .right-chat {
        text-align: right;
    }

    .chat-question {
        background-color: #93c47d;
        padding: 10px;
        margin: 10px;
        border-radius: 10px;
        width: 90%;
        display:inline-block;
        text-align: left;
    }

    .chat-answer {
        background-color: #6fa8dc;
        padding: 10px;
        margin: 10px;
        border-radius: 10px;
        width: 90%;
        display:inline-block;
        text-align: right;
    }

</style>
