<style>
    
    #buffer-form {
        border: solid 1px;
        border-radius: 5px;
        padding: 10px;
    }

    #buffer-select {
        height: auto;
        width: auto;
    }

    .form-input {
        padding: 5px;
    }

    .form-input label {
        display: inline-block;
        width: 150px;
    }

    .form-input input {
        width: 400px;
        display: inline-block;
    }

    .form-input-readonly {
        color: #666666;
    }

    .lds-dual-ring {
        /* change color here */
        color: #33fffc
    }

    .lds-dual-ring,
    .lds-dual-ring:after {
        box-sizing: border-box;
    }

    .lds-dual-ring {
        display: inline-block;
        width: 16px;
        height: 16px;
    }
    
    .lds-dual-ring:after {
        content: " ";
        display: block;
        width: 16px;
        height: 16px;
        margin: 1px;
        border-radius: 50%;
        border: 1.6px solid currentColor;
        border-color: currentColor transparent currentColor transparent;
        animation: lds-dual-ring 1.2s linear infinite;
    }
    
    @keyframes lds-dual-ring {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
    }
</style>
<div>
    <label for="buffer-select">Buffer Type:</label>
    <select name="buffer-select" id="buffer-select" onchange="createBufferForm()">    
        <option value="" selected>Select an Buffer</option>            
    </select>   
    <div class="lds-dual-ring" id="buffer-loader-ring"></div>      
    <form id="buffer-form">
         
    </form>
    <button onclick="submitBuffer()">Submit</button>
    <p id="submit-text"></p>
</div>
<script>

    var grabberURL = "http://localhost:10001/grabber/api/v1";
    var bufferTypesURL = grabberURL + "/buffers/config";
    var addBufferURL = grabberURL + "/buffers";
    
    var bufferConfigurations = {};

    function submitBuffer(){
        clearSubmitText();
        var form = document.getElementById("buffer-form");
        var formData = new FormData(form);
        var jsonData = {};
        for (const [key, value] of formData.entries()) {
            jsonData[key] = value;
        }
        console.log(jsonData);
        
        // extract type and id from jsonData
        var type = jsonData.type;
        var id = jsonData.id;

        var url = addBufferURL + "?type=" + type + "&id=" + id;

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(jsonData)
        })
        .then(response => response.text())
        .then(data => {
            console.log("Success:" + data);
            var submitText = document.getElementById("submit-text");
            submitText.innerHTML = "Success: " + data;
        })
        .catch((error) => {
            console.error("Error:" + error);
            var submitText = document.getElementById("submit-text");
            submitText.innerHTML = "Error: " + error;
        });
    }

    function retrieveBufferTypes(){
        
        fetch(bufferTypesURL, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            //console.log(data);          
            
            // cache the data
            bufferConfigurations = data;
            window.sessionStorage.setItem("bufferConfigurations", JSON.stringify(bufferConfigurations));

            createBufferOptions(bufferConfigurations);
            
        })
        .catch(error => console.error('Error:', error));
    }

    function createBufferOptions(configurations){
        var select = document.getElementById("buffer-select");
        for (const key in configurations) {
            var option = document.createElement("option");
            option.value = key;
            option.text = key;
            option.title = configurations[key].usage == null ? "" : configurations[key].usage;
            select.appendChild(option);
        };
        var loader = document.getElementById("buffer-loader-ring");
        loader.remove();
    }

    function createBufferForm(){
        clearBufferForm();
        clearSubmitText();

        var submitText = document.getElementById("submit-text");
        submitText.innerHTML = "";

        //console.log(adapterConfigurations);
        var select = document.getElementById("buffer-select");
        if (select.value == ""){
            alert("No Buffer type was selected");
            return;
        }
        // clear the form first
        var bufferConfig = bufferConfigurations[select.value].config;
        //console.log(adapterConfig);

        var form = document.getElementById("buffer-form");

        // create type and id first
        var type = bufferConfig.type;
        var id = bufferConfig.id;
        // clear those properties from adapterConfig, so that only used once
        delete bufferConfig.type;
        delete bufferConfig.id;

        var inputDiv = createInputDiv("type", type, true);
        form.appendChild(inputDiv);

        inputDiv = createInputDiv("id", id, false);
        form.appendChild(inputDiv);

        for (const key in bufferConfig) {
            var config = bufferConfig[key];
            inputDiv = createInputDiv(key, config, false);
            form.appendChild(inputDiv);
        }

    }

    function createInputDiv(key, config, readOnly){
        var div = document.createElement("div");
        div.className = "form-input";
        var label = document.createElement("label");
        label.innerHTML = key + ":";
        label.title = config.description == null ? "" : config.description;
        label.for = key;
        var input = document.createElement("input");
        input.name = key;
        input.value = config.defaultValue == null ? "" : config.defaultValue;
        input.title = config.description == null ? "" : config.description;
        switch (config.dataType) {
            case "STRING":
                input.type = "text";
                break;
            case "DOUBLE":
                input.type = "number";
                break;
            case "BOOLEAN":
                input.type = "checkbox";
                break;
            case "INT":
                input.type = "number";
                input.step = "1";
                break;
            case "SHORT":
                input.type = "numeric";
                input.step = "1";
                break;
            case "LONG":
                input.type = "numeric";
                input.step = "1";
                break;    
            default:
                input.type = "text";
        }
        if (readOnly){
            input.readOnly = true;
            input.className = "form-input-readonly";
        }

        div.appendChild(label);
        div.appendChild(input);
        return div;
    }

    function clearBufferForm(){
        var form = document.getElementById("buffer-form");
        while (form.firstChild) {
            form.removeChild(form.firstChild);
        }
    }

    function clearSubmitText(){
        var submitText = document.getElementById("submit-text");
        submitText.innerHTML = "";
    }

    // check if bufferConfigurations is already in sessionStorage
    bufferConfigurations = JSON.parse(window.sessionStorage.getItem("bufferConfigurations"));
    console.log(bufferConfigurations);
    if (bufferConfigurations == null){
        retrieveBufferTypes();
    } else {
        createBufferOptions(bufferConfigurations);
    }

</script>
